<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liqa</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
.app{--pink:#FF77B7;--pink-soft:#FFE1EF;--pink-pale:#FFF6FA;--purple:#7C4DDB;--purple-deep:#5A31B8;--purple-soft:#EEE6FF;--ink:#2B1646;--muted:#675680;--line:#F3D9E8;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#fff;min-height:100vh;font-size:16px;line-height:1.5}
.app *{box-sizing:border-box}
.app button,.app input,.app select,.app textarea{font-family:inherit}
.app :focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.app h1,.app h2,.app h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0;line-height:1.1;letter-spacing:-0.01em}
.app p{margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 24px;border-bottom:2px solid var(--pink-soft);background:#fff}
.logo{display:flex;align-items:center;gap:10px;font:600 32px Fredoka,sans-serif;color:var(--ink);line-height:1}
.logo-mark{width:38px;height:38px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center}
.logo-ar{font:700 15px Nunito,sans-serif;color:var(--purple-deep);background:var(--purple-soft);border-radius:999px;padding:3px 10px}
.nav{display:flex;gap:8px;flex:1 1 auto;justify-content:center}
.tab{min-height:44px;padding:0 20px;border-radius:999px;border:2px solid transparent;background:#fff;color:var(--ink);font-weight:800;font-size:16px;cursor:pointer}
.tab:hover{background:var(--pink-pale)}
.tab.on{background:var(--pink);border-color:var(--pink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font:600 18px Fredoka,sans-serif}
.user{display:flex;align-items:center;gap:10px;font-weight:700;background:#fff;border:2px solid transparent;border-radius:999px;padding:4px 6px 4px 16px;min-height:48px;cursor:pointer;color:var(--ink);font-size:16px}
.user:hover{background:var(--pink-pale)}
.user.on{background:var(--pink-soft)}
.wrap{max-width:1160px;margin:0 auto;padding:32px 24px 56px}
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-pink{background:var(--pink);color:var(--ink)}
.btn-pink:hover{filter:brightness(0.95)}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:var(--purple-deep)}
.btn-ghost{background:#fff;border-color:var(--purple);color:var(--purple-deep)}
.btn-ghost:hover{background:var(--purple-soft)}
.btn-done{background:var(--purple-soft);color:var(--purple-deep);border-color:var(--purple-soft)}
.btn-block{width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--pink-soft);color:var(--purple-deep);font-weight:800;font-size:14px;border-radius:999px;padding:6px 14px}
.hero{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.hero-l{flex:1 1 360px;min-width:0}
.hero-r{flex:1 1 440px;min-width:0}
.app .h1{font-size:clamp(36px,5.4vw,60px);margin:18px 0 16px}
.hl{background:linear-gradient(transparent 60%,var(--pink) 60%);padding:0 4px}
.lead{font-size:18px;color:var(--muted);max-width:520px}
.floaters{position:relative;margin-top:32px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.float{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 18px;font-weight:800;border:2px solid var(--line);background:#fff}
.float.f1{background:var(--pink-soft);border-color:var(--pink-soft);transform:rotate(-2deg)}
.float.f2{background:var(--purple-soft);border-color:var(--purple-soft);margin-left:36px;transform:rotate(1.5deg)}
.float.f3{background:var(--pink);border-color:var(--pink);margin-left:12px;transform:rotate(-1deg)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--purple)}
.panel{background:#fff;border:2px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 14px 40px rgba(124,77,219,0.10)}
.panel h2{font-size:28px;margin-bottom:4px}
.sub{color:var(--muted)}
.field{margin-top:18px}
.field label,.lbl{display:block;font-weight:800;margin-bottom:6px}
.input{width:100%;min-height:48px;padding:10px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:16px}
.input:focus{border-color:var(--purple)}
textarea.input{min-height:104px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row>div{flex:1 1 200px;min-width:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:15px;cursor:pointer}
.pill:hover{background:var(--pink-pale)}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--pink-pale)}
.chip.on{background:var(--pink);border-color:var(--pink)}
.err{margin-top:16px;background:var(--pink-pale);border:2px solid var(--pink);border-radius:16px;padding:10px 16px;font-weight:700;color:#8A0F46}
.count{font-size:14px;color:var(--muted);margin-top:8px;font-weight:700}
.fine{font-size:13px;color:var(--muted);margin-top:14px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.head h2{font-size:clamp(28px,4vw,40px)}
.mine{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--pink-pale);border:2px solid var(--pink-soft);border-radius:20px;padding:12px 16px;margin-bottom:20px}
.tagx{background:#fff;border:2px solid var(--pink-soft);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;color:var(--purple-deep)}
.filters{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end;margin-bottom:16px}
.filters .f{flex:1 1 180px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.ev{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:24px;overflow:hidden;background:#fff}
.ev:hover{border-color:var(--pink)}
.ev-top{display:flex;gap:14px;align-items:center;padding:16px;background:var(--pink-pale)}
.tile{width:66px;height:70px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.tile b{font:600 28px Fredoka,sans-serif;line-height:1}
.tile span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tile.a{background:var(--pink);color:var(--ink)}
.tile.b{background:var(--purple);color:#fff}
.tile.c{background:var(--pink-soft);color:var(--purple-deep)}
.price{margin-left:auto;font-weight:800;border-radius:999px;padding:4px 14px;background:#fff;border:2px solid var(--purple-soft);color:var(--purple-deep);white-space:nowrap}
.price.free{background:var(--purple);border-color:var(--purple);color:#fff}
.ev-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.ev-body h3{font-size:22px}
.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:15px}
.match{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--purple-deep);background:var(--purple-soft);border-radius:999px;padding:3px 12px;align-self:flex-start}
.ev-body .btn{margin-top:auto}
.empty{border:2px dashed var(--pink);border-radius:24px;padding:32px;text-align:center;background:var(--pink-pale)}
.back{margin-bottom:20px}
.detail{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.d-main{flex:1 1 520px;min-width:0}
.d-side{flex:1 1 300px;max-width:380px;min-width:0}
.d-band{border-radius:28px;background:linear-gradient(135deg,var(--pink) 0%,var(--pink-soft) 100%);padding:28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.d-band h1{font-size:clamp(30px,4.4vw,44px)}
.sec{margin-top:24px}
.sec h3{font-size:22px;margin-bottom:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start}
.tick{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;margin-top:1px}
.big-price{font:600 40px Fredoka,sans-serif;color:var(--purple-deep)}
.facts{display:flex;flex-direction:column;gap:12px;margin:16px 0 20px}
.confirm{margin-top:14px;background:var(--purple-soft);border-radius:16px;padding:12px 16px;font-weight:700;color:var(--purple-deep)}
.banner{border-radius:28px;background:var(--pink-soft);padding:32px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;margin-bottom:28px}
.banner>div{flex:1 1 320px;min-width:0}
.banner h1{font-size:clamp(30px,4.4vw,46px);margin:14px 0 12px}
.steps{display:flex;flex-direction:column;gap:12px;flex:1 1 300px}
.step{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:12px 16px;font-weight:700}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font:600 18px Fredoka,sans-serif}
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.venue{border:2px solid var(--line);border-radius:24px;padding:20px;background:#fff;display:flex;flex-direction:column;gap:10px}
.venue.open{grid-column:1/-1;border-color:var(--pink);background:var(--pink-pale)}
.venue h3{font-size:22px}
.kind{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--purple-deep)}
.form{margin-top:8px;background:#fff;border:2px solid var(--pink-soft);border-radius:20px;padding:20px;max-width:720px}
.sent{border:2px solid var(--purple-soft);border-radius:20px;padding:16px 20px;background:#fff;margin-bottom:14px}
.track{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stp{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:800;background:#fff;border:2px solid var(--line);color:var(--muted)}
.stp.done{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.stp.cur{background:var(--purple-soft);border-color:var(--purple);color:var(--purple-deep)}
.avatar.big{width:84px;height:84px;font-size:38px}
.p-head{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-bottom:24px}
.p-head h1{font-size:clamp(30px,4.4vw,44px)}
.act{display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:2px solid var(--line);border-radius:20px;padding:14px 16px;background:#fff;margin-bottom:12px}
.act .tile{width:56px;height:60px}
.act .tile b{font-size:24px}
.act-body{flex:1 1 220px;min-width:0}
.soc{padding:14px 0;border-top:2px solid var(--pink-soft)}
.soc:first-of-type{border-top:0}
.soc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.soc-row{display:flex;gap:10px}
.soc-row .input{flex:1 1 auto;min-width:0}
.obadge{border-radius:18px;padding:10px 16px;font:600 26px Fredoka,sans-serif;line-height:1.1;min-height:70px;display:flex;align-items:center}
.obadge.a{background:var(--pink);color:var(--ink)}
.obadge.b{background:var(--purple);color:#fff}
.obadge.c{background:var(--pink-soft);color:var(--purple-deep)}
.punch{display:flex;gap:8px;flex-wrap:wrap}
.pd{width:28px;height:28px;border-radius:50%;border:2px dashed var(--purple)}
.pd.free{border-style:solid;border-color:var(--pink);background:var(--pink)}
.foot{border-top:2px solid var(--pink-soft);padding:20px 24px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:720px){
.top{padding:12px 16px}
.nav{order:3;flex:1 1 100%}
.tab{flex:1}
.user .uname{display:none}
.wrap{padding:24px 16px 40px}
.panel{padding:20px}
.banner{padding:22px}
.float.f2,.float.f3{margin-left:0}
}
</style>
</head>

        '<p>' + esc(o.desc) + '</p>' + dots + '<p class="fine" style="margin:0">' + esc(o.fine) + '</p>' +
        '<button class="btn ' + (claimed ? 'btn-done' : 'btn-pink') + '" ' + attr('claim', o.id) + '>' + (claimed ? 'Claimed' : 'Claim offer') + '</button>' +
        (claimed ? '<p class="confirm" style="margin:0">Added to your offers. Show your Liqa profile at the venue.</p>' : '') + '</div></article>';
    }).join('');
    return '<section><div class="head"><div><h2>Offers</h2><p class="sub">Save when you keep coming back, or bring a friend along. Sample offers for this prototype.</p></div>' +
      '<div class="seg" role="group" aria-label="Offer types">' + filters + '</div></div><div class="grid">' + cards + '</div></section>';
  }

  function teenView() {
    var ask = state.pitchMode === 'ask';
    var steps = ['Sent', 'Venue replies', 'Planning together', 'Event goes live'];
    var pitches = state.pitches.map(function (p) {
      return '<div class="sent"><div style="font-weight:800">' + esc(p.title) + '</div><div class="sub">' + esc(p.modeLabel) + ' to ' + esc(p.venue) + '. They will follow up with you here.</div><div class="track">' +
        steps.map(function (l, i) { return '<span class="stp ' + (i === 0 ? 'done' : (i === 1 ? 'cur' : '')) + '">' + l + '</span>'; }).join('') + '</div></div>';
    }).join('');
    var venues = VENUES.map(function (v) {
      var open = state.pitchVenue === v.id;
      var hosts = v.hosts.map(function (h) { return '<span class="tagx">' + esc(h) + '</span>'; }).join('');
      var form = '';
      if (open) {
        form = '<div class="form"><div class="seg" style="margin-bottom:6px">' +
          '<button type="button" class="pill ' + cls(!ask) + '" aria-pressed="' + pressed(!ask) + '" ' + attr('pmode', 'pitch') + '>Pitch an event</button>' +
          '<button type="button" class="pill ' + cls(ask) + '" aria-pressed="' + pressed(ask) + '" ' + attr('pmode', 'ask') + '>Ask a question</button></div>' +
          '<div class="field"><label for="p-title">' + (ask ? 'What is your question about?' : 'Event title') + '</label><input class="input" id="p-title" type="text" value="' + esc(state.pitchTitle) + '" data-in="pitchTitle"></div>' +
          '<div class="field"><label for="p-date">When are you thinking? (optional)</label><input class="input" id="p-date" type="text" value="' + esc(state.pitchDate) + '" data-in="pitchDate"></div>' +
          '<div class="field"><label for="p-msg">Your message</label><textarea class="input" id="p-msg" data-in="pitchMsg">' + esc(state.pitchMsg) + '</textarea></div>' +
          (state.pitchError ? '<p class="err" role="alert" data-err>' + esc(state.pitchError) + '</p>' : '') +
          '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px"><button type="button" class="btn btn-pink" ' + attr('psend', v.id) + '>' + ICON.send + 'Send to venue</button>' +
          '<button type="button" class="btn btn-ghost" ' + attr('pcancel') + '>Cancel</button></div></div>';
      }
      return '<article class="venue ' + (open ? 'open' : '') + '"><span class="kind">' + esc(v.kind) + '</span><h3>' + esc(v.name) + '</h3><div class="meta">' + ICON.pin('#5A31B8', 18) + '<span>' + esc(v.area) + '</span></div>' +
        '<p>' + esc(v.about) + '</p><div class="chips">' + hosts + '</div>' +
        (open ? form : '<button class="btn btn-pink" style="margin-top:6px;align-self:flex-start" ' + attr('popen', v.id) + '>Contact and pitch</button>') + '</article>';
    }).join('');
    return '<section><div class="banner"><div><span class="eyebrow">Teen Hub</span><h1>Got an idea for an event? Pitch it.</h1>' +
      '<p class="lead">Connect with registered venues and organisations around Muscat. Send your pitch, and they will follow up and support you in making it happen.</p></div>' +
      '<div class="steps"><div class="step"><span class="num">1</span><span>Pick a venue that fits your idea</span></div><div class="step"><span class="num">2</span><span>Send your pitch or ask a question</span></div><div class="step"><span class="num">3</span><span>The venue follows up and helps you plan</span></div></div></div>' +
      (state.pitches.length ? '<div style="margin-bottom:28px"><h2 style="font-size:28px;margin-bottom:14px">Your pitches</h2>' + pitches + '</div>' : '') +
      '<h2 style="font-size:28px;margin-bottom:14px">Registered venues</h2><div class="v-grid">' + venues + '</div></section>';
  }

  function screenView() {
    switch (state.screen) {
      case 'events': return eventsView();
      case 'detail': return detailView();
      case 'profile': return profileView();
      case 'offers': return offersView();
      case 'teen': return teenView();
      default: return signupView();
    }
  }

  function render() {
    var act = document.activeElement, key = null, pos = null;
    if (act && act !== document.body && app.contains(act)) {
      if (act.id) key = '#' + act.id;
      else if (act.dataset && act.dataset.a) key = '[data-a="' + act.dataset.a + '"]' + (act.dataset.v !== undefined ? '[data-v="' + act.dataset.v + '"]' : '');
      try { pos = act.selectionStart; } catch (e) {}
    }
    app.innerHTML = header() + '<main class="wrap">' + screenView() + '</main><footer class="foot">Liqa is a prototype. Events, venues and prices shown are sample content.</footer>';
    if (key) {
      var el = app.querySelector(key);
      if (el) {
        el.focus();
        if (pos !== null && el.setSelectionRange) { try { el.setSelectionRange(pos, pos); } catch (e) {} }
      }
    }
  }

  function go(screen) { state.screen = screen; render(); window.scrollTo(0, 0); }

  function submitSignup() {
    var sel = state.interests;
    if (!state.name.trim()) { state.signupError = 'Please add your first name.'; render(); return; }
    if (state.email.indexOf('@') < 1) { state.signupError = 'Please add a valid email address.'; render(); return; }
    if (sel.length < 3) { state.signupError = 'Pick at least 3 interests so we can recommend the right events.'; render(); return; }
    state.signedUp = true; state.signupError = ''; state.filter = 'foryou';
    go('events');
  }

  function sendPitch(venueId) {
    var ask = state.pitchMode === 'ask';
    if (!state.pitchTitle.trim() || !state.pitchMsg.trim()) {
      state.pitchError = 'Add a title and a short message so the venue knows what you have in mind.';
      render();
      return;
    }
    var v = VENUES.filter(function (x) { return x.id === venueId; })[0];
    state.pitches.unshift({ venue: v.name, title: state.pitchTitle.trim(), modeLabel: ask ? 'Question sent' : 'Pitch sent' });
    state.pitchVenue = ''; state.pitchTitle = ''; state.pitchDate = ''; state.pitchMsg = ''; state.pitchError = ''; state.pitchMode = 'pitch';
    render();
    window.scrollTo(0, 0);
  }

  function toggle(list, id) { var i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); }

  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el || !app.contains(el)) return;
    var a = el.dataset.a, v = el.dataset.v;
    switch (a) {
      case 'go': go(v); break;
      case 'interest': toggle(state.interests, v); state.signupError = ''; render(); break;
      case 'age': state.age = v; render(); break;
      case 'scope': state.filter = v; render(); break;
      case 'free': state.freeOnly = !state.freeOnly; render(); break;
      case 'reset': state.filter = 'all'; state.freeOnly = false; state.sort = 'match'; state.day = 'any'; state.slot = 'any'; render(); break;
      case 'open': state.selId = v; go('detail'); break;
      case 'reserve': toggle(state.reserved, v); render(); break;
      case 'ptab': state.profTab = v; render(); break;
      case 'link':
        var d = (state.socialDraft[v] || '').trim();
        if (!d) {
          var names = { li: 'LinkedIn', ig: 'Instagram', x: 'X' };
          state.socialError = 'Add your ' + names[v] + ' link or handle first.';
        } else {
          state.socialLinked[v] = d; state.socialDraft[v] = ''; state.socialError = '';
        }
        render(); break;
      case 'unlink': state.socialLinked[v] = ''; render(); break;
      case 'ofilter': state.offerFilter = v; render(); break;
      case 'claim': toggle(state.claimedOffers, v); render(); break;
      case 'popen': state.pitchVenue = v; state.pitchError = ''; render(); break;
      case 'pcancel': state.pitchVenue = ''; state.pitchError = ''; render(); break;
      case 'pmode': state.pitchMode = v; render(); break;
      case 'psend': sendPitch(v); break;
    }
  });

  app.addEventListener('input', function (ev) {
    var el = ev.target;
    var k = el.getAttribute && el.getAttribute('data-in');
    if (!k) return;
    if (k.indexOf('soc:') === 0) { state.socialDraft[k.slice(4)] = el.value; state.socialError = ''; }
    else { state[k] = el.value; }
    state.signupError = ''; state.pitchError = '';
    var errs = app.querySelectorAll('[data-err]');
    for (var i = 0; i < errs.length; i++) errs[i].remove();
  });

  app.addEventListener('change', function (ev) {
    var el = ev.target;
    var k = el.getAttribute && el.getAttribute('data-sel');
    if (!k) return;
    state[k] = el.value;
    render();
  });

  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'signup-form') submitSignup();
  });

  render();
})();
</script>
</body>
</html>

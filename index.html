  <div id="__bundler_placeholder">Loading Liqa...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B1646\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.3\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n<span>Liqa<\u002Fspan>\n<span class=\"logo-ar\" lang=\"ar\">لقاء<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ signedUp }}\" hint-placeholder-val=\"{{ false }}\">\n<nav class=\"nav\" aria-label=\"Main\">\n<button class=\"tab {{ discoverCls }}\" sc-camel-on-click=\"{{ goDiscover }}\">Discover<\u002Fbutton>\n<button class=\"tab {{ offersCls }}\" sc-camel-on-click=\"{{ goOffers }}\">Offers<\u002Fbutton>\n<button class=\"tab {{ teenCls }}\" sc-camel-on-click=\"{{ goTeen }}\">Teen Hub<\u002Fbutton>\n<\u002Fnav>\n<button class=\"user {{ profileCls }}\" aria-label=\"Open your profile\" sc-camel-on-click=\"{{ goProfile }}\"><span class=\"uname\">{{ firstName }}<\u002Fspan><span class=\"avatar\" aria-hidden=\"true\">{{ initial }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fheader>\n\n<main class=\"wrap\">\n\n<sc-if value=\"{{ isSignup }}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"hero\">\n<div class=\"hero-l\">\n<span class=\"eyebrow\">Third places in Muscat<\u002Fspan>\n<h1 class=\"h1\">Find your spot. <span class=\"hl\">Find your people.<\u002Fspan><\u002Fh1>\n<p class=\"lead\">Beyond home and school or work, there are cafés, trails, studios and courts where community happens. Liqa shows you what is on around Muscat, matched to what you love, and gives teens a way to run their own events.<\u002Fp>\n<div class=\"floaters\" aria-hidden=\"true\">\n<span class=\"float f1\"><span class=\"dot\"><\u002Fspan>Open mic night · Al Khuwair<\u002Fspan>\n<span class=\"float f2\"><span class=\"dot\"><\u002Fspan>Padel mixer · Seeb<\u002Fspan>\n<span class=\"float f3\"><span class=\"dot\"><\u002Fspan>Sunrise yoga · Al Mouj<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class "M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n{{ c.label }}\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p class=\"count\">{{ countText }}<\u002Fp>\n<\u002Fdiv>\n<sc-if value=\"{{ hasSignupError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{ signupError }}<\u002Fp><\u002Fsc-if>\n<div style=\"margin-top:22px\"><button type=\"submit\" class=\"btn btn-pink btn-block\">Show me what is on<\u002Fbutton><\u002Fdiv>\n<p class=\"fine\">Your picks help us recommend events near you. You can change them any time.<\u002Fp>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEvents }}\" hint-placeholder-val=\"{{ false }}\">\n<section>\n<div class=\"head\">\n<div>\n<h2>Happening around Muscat<\u002Fh2>\n<p class=\"sub\">Upcoming events and activities. Sample listings for this prototype.<\u002Fp>\n<\u002Fdiv>\n<div class=\"seg\" role=\"group\" aria-label=\"Which events to show\">\n<button class=\"pill {{ fForYou }}\" aria-pressed=\"{{ pForYou }}\" sc-camel-on-click=\"{{ setForYou }}\">Matches my interests<\u002Fbutton>\n<button class=\"pill {{ fAll }}\" aria-pressed=\"{{ pAll }}\" sc-camel-on-click=\"{{ setAll }}\">All events<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"filters\">\n<div class=\"f\"><label class=\"lbl\" for=\"f-sort\">Sort by<\u002Flabel>\n<sc-raw-select class=\"input\" id=\"f-sort\" value=\"{{ sort }}\" sc-camel-on-change=\"{{ onSort }}\"><sc-for list=\"{{ sortOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n<div class=\"f\"><label class=\"lbl\" for=\"f-day\">Day<\u002Flabel>\n<sc-raw-select class=\"input\" id=\"f-day\" value=\"{{ day }}\" sc-camel-on-change=\"{{ onDay }}\"><sc-for list=\"{{ dayOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n<div class=\"f\"><label class=\"lbl \" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.3\"><\u002Fcircle><\u002Fsvg><span>{{ ev.venue }}, {{ ev.area }}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{ ev.hasMatch }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"match\">{{ ev.matchText }}<\u002Fspan><\u002Fsc-if>\n<button class=\"btn btn-purple\" aria-label=\"See details for {{ ev.title }}\" sc-camel-on-click=\"{{ ev.open }}\">See details<\u002Fbutton>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noEvents }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"empty\"><h3 style=\"margin-bottom:8px\">Nothing matches yet<\u002Fh3><p class=\"sub\" style=\"margin-bottom:16px\">Try All events, or add more interests.<\u002Fp><button class=\"btn btn-pink\" sc-camel-on-click=\"{{ resetFilters }}\">Show all events<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n<section>\n<button class=\"btn btn-ghost back\" sc-camel-on-click=\"{{ goDiscover }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5A31B8\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"><\u002Fpath><\u002Fsvg>All events<\u002Fbutton>\n<div class=\"detail\">\n<div class=\"d-main\">\n<div class=\"d-band\">\n<div class=\"tile b\" style=\"width:84px;height:88px\"><b style=\"font-size:36px\">{{ sel.day }}<\u002Fb><span>{{ sel.mon }}<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 240px;min-width:0\"><h1>{{ sel.title }}<\u002Fh1><p style=\"font-weight:700;margin-top:8px\">{{ sel.venue }}, {{ sel.area }}<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"chips\" style=\"margin-bottom:8px\">\n<sc-for list=\"{{ sel.tagList }}\" as=\"t\" hint-placeholder-count=\"2\"><span class=\"tagx\">{{ t.l host.<\u002Fp><\u002Fsc-if>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n<section>\n<div class=\"p-head\">\n<span class=\"avatar big\" aria-hidden=\"true\">{{ initial }}<\u002Fspan>\n<div><h1>{{ name }}<\u002Fh1><p class=\"sub\">{{ area }}, Muscat · {{ ageLabel }}<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"detail\">\n<div class=\"d-main\">\n<div class=\"seg\" role=\"group\" aria-label=\"Your activity\" style=\"margin-bottom:18px\">\n<sc-for list=\"{{ profTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button class=\"pill {{ t.cls }}\" aria-pressed=\"{{ t.pressed }}\" sc-camel-on-click=\"{{ t.pick }}\">{{ t.label }} ({{ t.count }})<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ hasProfItems }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<sc-for list=\"{{ profItems }}\" as=\"it\" hint-placeholder-count=\"2\">\n<div class=\"act\">\n<div class=\"tile {{ it.tile }}\"><b>{{ it.day }}<\u002Fb><span>{{ it.mon }}<\u002Fspan><\u002Fdiv>\n<div class=\"act-body\"><div style=\"font-weight:800\">{{ it.title }}<\u002Fdiv><div class=\"sub\" style=\"font-size:15px\">{{ it.sub }}<\u002Fdiv><\u002Fdiv>\n<span class=\"stp {{ it.statusCls }}\">{{ it.status }}<\u002Fspan>\n<sc-if value=\"{{ it.hasAction }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-ghost\" style=\"min-height:40px;padding:0 16px\" aria-label=\"{{ it.actionLabel }}\" sc-camel-on-click=\"{{ it.action }}\">View<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noProfItems }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"empty\"><h3 style=\"margin-bottom:8px\">{{ emptyTitle }}<\u002Fh3><p class=\"sub\" style=\"margin-bottom:16px\">{{ emptyText }}<\u002Fp><button class=\"btn btn-pink\" sc-camel-on-click=\"{{ emptyAction }}\">{{ emptyCta }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ showHistoryNote }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"fine\">Past events shown here are sample history for the prototype.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<aside class=\"d-side panel\">\n<h2 style=\"font-size:24px\">Link your socials<\u002Fh2>\n<p class=\"sub\" style=\"margin-bottom:8px\">Add your profiles so hosts and other members can find you.<\u002Fp>\n<sc-for list=\"{{ socials }}\" as=\"n\" hint-placeholder-count=\"3\">\n<div class=\"soc\">\n<div class=\"soc-top\"><label class=\"lbl\" style=\"margin:0\" for=\"{{ n.id }}\">{{ n.label }}<\u002Flabel>\n<sc-if value=\"{{ n.linked }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"stp done\">Linked<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<sc-if value=\"{{ n.unlinked }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"soc-row\"><input class=\"input\" id=\"{{ n.id }}\" type=\"text\" placeholder=\"{{ n.ph }}\" value=\"{{ n.draft }}\" sc-camel-on-input=\"{{ n.onDraft }}\"><button class=\"btn btn-purple\" style=\"min-height:48px;padding:0 18px\" sc-camel-on-click=\"{{ n.link }}\">Link<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ n.linked }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"soc-row\" id=\"{{ n.id }}\"><span class=\"input\" style=\"display:flex;align-items:center;overflow:hidden\">{{ n.handle }}<\u002Fspan><button class=\"btn btn-ghost\" style=\"min-height:48px;padding:0 18px\" aria-label=\"Unlink {{ n.label }}\" sc-camel-on-click=\"{{ n.unlink }}\">Unlink<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ hasSocialError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{ socialError }}<\u002Fp><\u002Fsc-if>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOffers }}\" hint-placeholder-val=\"{{ false }}\">\n<section>\n<div class=\"head\">\n<div>\n<h2>Offers<\u002Fh2>\n<p class=\"sub\">Save when you keep coming back, or bring a friend along. Sample offers for this prototype.<\u002Fp>\n<\u002Fdiv>\n<div class=\"seg\" role=\"group\" aria-label=\"Offer types\">\n<sc-for list=\"{{ offerFilters }}\" as=\"f\" hint-placeholder-count=\"4\"><button class=\"pill {{ f.cls }}\" aria-pressed=\"{{ f.pressed }}\" sc-camel-on-click=\"{{ f.pick }}\">{{ f.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid\">\n<sc-for list=\"{{ offers }}\" as=\"o\" hint-placeholder-count=\"3\">\n<article class=\"ev\">\n<div class=\"ev-top\"><div class=\"obadge {{ o.tile }}\">{{ o.badge }}<\u002Fdiv><span class=\"price\">{{ o.label }}<\u002Fspan><\u002Fdiv>\n<div class=\"ev-body\">\n<h3>{{ o.title }}<\u002Fh3>\n<div class=\"meta\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5A31B8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.3\"><\u002Fcircle><\u002Fsvg><span>{{ o.venue }}, {{ o.area }}<\u002Fspan><\u002Fdiv>\n<p>{{ o.desc }}<\u002Fp>\n<sc-if value=\"{{ o.isLoop }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"punch\" role=\"img\" aria-label=\"{{ o.punchLabel }}\"><sc-for list=\"{{ o.dots }}\" as=\"d\" hint-placeholder-count=\"5\"><span class=\"pd {{ d.cls }}\"><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<\u002Fsc-if>\n<p class=\"fine\" style=\"margin:0\">{{ o.fine }}<\u002Fp>\n<button class=\"btn {{ o.claimCls }}\" sc-camel-on-click=\"{{ o.claim }}\">{{ o.claimText }}<\u002Fbutton>\n<sc-if value=\"{{ o.claimed }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"confirm\" style=\"margin:0\">Added to your offers. Show your Liqa profile at the venue.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTeen }}\" hint-placeholder-val=\"{{ false }}\">\n<section>\n<div class=\"banner\">\n<div>\n<span class=\"eyebrow\">Teen Hub<\u002Fspan>\n<h1>Got an idea for an event? Pitch it.<\u002Fh1>\n<p class=\"lead\">Connect with registered venues and organisations around Muscat. Send your pitch, and they will follow up and support you in making it happen.<\u002Fp>\n<\u002Fdiv>\n<div class=\"steps\">\n<div class=\"step\"><span class=\"num\">1<\u002Fspan><span>Pick a venue that fits your idea<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><span class=\"num\">2<\u002Fspan><span>Send your pitch or ask a question<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><span class=\"num\">3<\u002Fspan><span>The venue follows up and helps you plan<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ hasPitches }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-bottom:28px\">\n<h2 style=\"font-size:28px;margin-bottom:14px\">Your pitches<\u002Fh2>\n<sc-for list=\"{{ pitches }}\" as=\"p\" hint-placeholder-count=\"1\">\n<div class=\"sent\">\n<div style=\"font-weight:800\">{{ p.title }}<\u002Fdiv>\n<div class=\"sub\">{{ p.modeLabel }} to {{ p.venue }}. They will follow up with you here.<\u002Fdiv>\n<div class=\"track\">\n<sc-for list=\"{{ p.steps }}\" as=\"s\" hint-placeholder-count=\"4\"><span class=\"stp {{ s.cls }}\">{{ s.label }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<h2 style=\"font-size:28px;margin-bottom:14px\">Registered venues<\u002Fh2>\n<div class=\"v-grid\">\n<sc-for list=\"{{ venues }}\" as=\"v\" hint-placeholder-count=\"3\">\n<article class=\"venue {{ v.cls }}\">\n<span class=\"kind\">{{ v.kind }}<\u002Fspan>\n<h3>{{ v.name }}<\u002Fh3>\n<div class=\"meta\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5A31B8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.3\"><\u002Fcircle><\u002Fsvg><span>{{ v.area }}<\u002Fspan><\u002Fdiv>\n<p>{{ v.about }}<\u002Fp>\n<div class=\"chips\"><sc-for list=\"{{ v.hosts }}\" as=\"h\" hint-placeholder-count=\"2\"><span class=\"tagx\">{{ h.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<sc-if value=\"{{ v.closed }}\" hint-placeholder-val=\"{{ true }}\">\n<button class=\"btn btn-pink\" style=\"margin-top:6px;align-self:flex-start\" sc-camel-on-click=\"{{ v.openForm }}\">Contact and pitch<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ v.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"form\">\n<div class=\"seg\" style=\"margin-bottom:6px\">\n<button type=\"button\" class=\"pill {{ v.pitchCls }}\" aria-pressed=\"{{ v.pitchPressed }}\" sc-camel-on-click=\"{{ v.modePitch }}\">Pitch an event<\u002Fbutton>\n<button type=\"button\" class=\"pill {{ v.askCls }}\" aria-pressed=\"{{ v.askPressed }}\" sc-camel-on-click=\"{{ v.modeAsk }}\">Ask a question<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"field\"><label for=\"{{ v.idTitle }}\">{{ v.titleLabel }}<\u002Flabel><input class=\"input\" id=\"{{ v.idTitle }}\" type=\"text\" value=\"{{ v.fTitle }}\" sc-camel-on-input=\"{{ v.onTitle }}\"><\u002Fdiv>\n<div class=\"field\"><label for=\"{{ v.idDate }}\">When are you thinking? (optional)<\u002Flabel><input class=\"input\" id=\"{{ v.idDate }}\" type=\"text\" value=\"{{ v.fDate }}\" sc-camel-on-input=\"{{ v.onDate }}\"><\u002Fdiv>\n<div class=\"field\"><label for=\"{{ v.idMsg }}\">Your message<\u002Flabel><textarea class=\"input\" id=\"{{ v.idMsg }}\" value=\"{{ v.fMsg }}\" sc-camel-on-input=\"{{ v.onMsg }}\"><\u002Ftextarea><\u002Fdiv>\n<sc-if value=\"{{ v.hasError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{ v.error }}<\u002Fp><\u002Fsc-if>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:18px\">\n<button type=\"button\" class=\"btn btn-pink\" sc-camel-on-click=\"{{ v.send }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B1646\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 3L1 nd courts where community happens. Liqa shows you what is on around Muscat, matched to what you love, and gives teens a way to run their own events.<\u002Fp>\n<div class=\"floaters\" aria-hidden=\"true\">\n<span class=\"float f1\"><span class=\"dot\"><\u002Fspan>Open mic night · Al Khuwair<\u002Fspan>\n<span class=\"float f2\"><span class=\"dot\"><\u002Fspan>Padel mixer · Seeb<\u002Fspan>\n<span class=\"float f3\"><span class=\"dot\"><\u002Fspan>Sunrise yoga · Al Mouj<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hero-r\">\n<form class=\"panel\">\n<h2>Join Liqa<\u002Fh2>\n<p class=\"sub\">Tell us a little about you and pick what you are into.<\u002Fp>\n<div class=\"row\">\n<div class=\"field\"><label for=\"f-name\">First name<\u002Flabel><input class=\"input\" id=\"f-name\" type=\"text\" autocomplete=\"given-name\"><\u002Fdiv>\n<div class=\"field\"><label for=\"f-email\">Email<\u002Flabel><input class=\"input\" id=\"f-email\" type=\"email\" autocomplete=\"email\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"row\">\n<div class=\"field\"><label for=\"f-area\">Where in Muscat are you?<\u002Flabel>\n<select class=\"input\" id=\"f-area\">\n<option>{{ a.v }}<\u002Foption>\n<\u002Fselect><\u002Fdiv>\n<div class=\"field\"><span class=\"lbl\">I am a<\u002Fspan>\n<div class=\"seg\">\n<button type=\"button\" class=\"pill \">Teen (13 to 17)<\u002Fbutton>\n<button type=\"button\" class=\"pill \">Adult<\u002Fbutton>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"field\"><span class=\"lbl\">Interests and hobbies<\u002Fspan>\n<div class=\"chips\">\n\n<button type=\"button\" class=\"chip \">\n<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2B1646\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>\n{{ c.label }}\n<\u002Fbutton>\n\n<\u002Fdiv>\n<p class=\"count\">{{ countText }}<\u002Fp>\n<\u002Fdiv>\n<p class=\"err\" role=\"alert\">{{ signupError }} , { id: 'fitness', label: 'Fitness and yoga' },\n      { id: 'startup', label: 'Startups and ideas' }\n    ];\n  }\n\n  getEvents() {\n    return [\n      { id: 'e1', title: 'Open Mic Night', tags: ['music'], venue: 'Echo Room Cafe', area: 'Al Khuwair', dow: 'Thu', day: '5', time: '7:30 PM', cost: 2,\n        desc: 'Sing, read, play or just come to listen. Sign up on the night for a short slot and enjoy an evening of local talent in a relaxed room.',\n        includes: ['A five-minute performance slot if you want one', 'Seating and a house soft drink', 'A friendly crowd of first-timers and regulars'],\n        know: 'Doors open 30 minutes early. Bring your own instrument or use the house keyboard.' },\n      { id: 'e2', title: 'Sunrise Beach Clean-up', tags: ['volunteer', 'outdoors'], venue: 'Mouj Beach Front', area: 'Al Mouj', dow: 'Fri', day: '6', time: '6:30 AM', cost: 0,\n        desc: 'Start the weekend by keeping the shoreline lovely. We clean for an hour, then walk and chat along the water.',\n        includes: ['Gloves and bags', 'Water and dates after the clean-up', 'A relaxed shoreline walk'],\n        know: 'Wear closed shoes and sun protection. Free to join.' },\n      { id: 'e3', title: 'Board Game Social', tags: ['boardgames'], venue: 'Dice and Dates', area: 'Al Khuwair', dow: 'Fri', day: '6', time: '5:00 PM', cost: 3,\n        desc: 'A shelf of games, a table for every level, and hosts who will teach you the rules. Come with friends or meet a new group.',\n        includes: ['Access to the full game library', 'A host to teach new games', 'One hot drink'],\n        know: 'Tables fill up quickly, so arrive early on the day.' },\n      { id: 'e4', title: 'Sunrise Yoga on the Lawn', tags: ['fitness', 'outdoors'], venue: 'Mouj Community Lawn', area: 'Al Mouj', dow: 'Sat', day: '7', time: '6:15 AM', cost: 5,\n        desc: 'A gentle outdoor flow for all levels, finishing with a short breathing session as the sun comes up.',\n        includes: ['A 60-minute   const cost = (c) => (c === 0 ? 'Free' : 'OMR ' + c);\n    const scored = this.getEvents().map((e, idx) => {\n      const m = e.tags.filter((t) => sel.includes(t));\n      const near = e.area === s.area;\n      return { e, idx, m, near, score: m.length * 2 + (near ? 1 : 0) };\n    });\n    const hour24 = (t) => {\n      const p = t.match(/(\\d+):(\\d+)\\s*(AM|PM)/);\n      let h = parseInt(p[1], 10) % 12;\n      if (p[3] === 'PM') h += 12;\n      return h;\n    };\n    const slotOf = (t) => { const h = hour24(t); return h < 12 ? 'morning' : (h < 17 ? 'afternoon' : 'evening'); };\n    let list = scored;\n    if (s.filter === 'foryou') list = list.filter((x) => x.m.length > 0 || x.near);\n    if (s.freeOnly) list = list.filter((x) => x.e.cost === 0);\n    if (s.day === 'weekend') list = list.filter((x) => x.e.dow === 'Fri' || x.e.dow === 'Sat');\n    else if (s.day !== 'any') list = list.filter((x) => x.e.dow + ' ' + x.e.day === s.day);\n    if (s.slot !== 'any') list = list.filter((x) => slotOf(x.e.time) === s.slot);\n    const sorters = {\n      match: (a, b) => b.score - a.score || a.idx - b.idx,\n      soon: (a, b) => a.idx - b.idx,\n      low: (a, b) => a.e.cost - b.e.cost || a.idx - b.idx,\n      high: (a, b) => b.e.cost - a.e.cost || a.idx - b.idx\n    };\n    list = list.slice().sort(sorters[s.sort] || sorters.match);\n    const sortOpts = [{ v: 'match', label: 'Best match' }, { v: 'soon', label: 'Soonest first' }, { v: 'low', label: 'Price: low to high' }, { v: 'high', label: 'Price: high to low' }];\n    const seenDays = [];\n    const dayOpts = [{ v: 'any', label: 'Any day' }, { v: 'weekend', label: 'Weekend (Fri and Sat)' }];\n    this.getEvents().forEach((e) => {\n      const k = e.dow + ' ' + e.day;\n      if (seenDays.indexOf(k) < 0) { seenDays.push(k); dayOpts.push({ v: k, label: e.dow + ' ' + e.day + ' Nov' }); }\n    });\n    const slotOpts = [{ v: 'any', label: 'Any time' }, { v: 'morning', label: 'Morning (before 12 PM)' }, { v: 'afternoon', label: 'Afternoon (12 to 5 PM)' }, { v: 'evening', label: 'Evening (after 5 PM)' }];\n    const hasActive = s.freeOnly || s.day !== 'any' || s.slot !== 'any' || s.sort !== 'match';\n    const tiles = ['a', 'b', 'c'];\n    const events = list.map((x, n) => {\n      let matchText = '';\n      if (x.m.length) matchText = 'Matches ' + x.m.slice(0, 2).map((t) => labelOf[t]).join(' and ');\n      else if (x.near) matchText = 'Near you in ' + x.e.area;\n      return {\n        title: x.e.title, venue: x.e.venue, area: x.e.area, dow: x.e.dow, day: x.e.day, mon: 'Nov', time: x.e.time,\n        price: cost(x.e.cost), priceCls: x.e.cost === 0 ? 'free' : '', tile: tiles[n % 3],\n        hasMatch: matchText !== '', matchText,\n        open: () => { set({ selId: x.e.id, screen: 'detail' }); top(); }\n      };\n    });\n\n    const cur = this.getEvents().filter((e) => e.id === s.selId)[0] || this.getEvents()[0];\n    const isRes = s.reserved.includes(cur.id);\n    const selView = {\n      title: cur.title, venue: cur.venue, area: cur.area, dow: cur.dow, day: cur.day, mon: 'Nov', time: cur.time,\n      price: cost(cur.cost), desc: cur.desc, know: cur.know,\n      includes: cur.includes.map((t) => ({ t })),\n      tagList: cur.tags.map((t) => ({ label: labelOf[t] })),\n      reserved: isRes,\n      reserveText: isRes ? 'Interest sent' : (cur.cost === 0 ? 'Count me in' : 'Reserve my spot'),\n      reserveCls: isRes ? 'btn-done' : 'btn-pink',\n      reserve: () => set({ reserved: isRes ? s.reserved.filter((x) => x !== cur.id) : s.reserved.concat(cur.id) })\n    };\n\n    const onTitle = (e) => set({ pitchTitle: e.target.value, pitchError: '' });\n    const onDate = (e) => set({ pitchDate: e.target.value });\n    const onMsg = (e) => set({ pitchMsg: e.target.value, pitchError: '' });\n    const ask = s.pitchMode === 'ask';\n    const venues = this.getVenues().map((v) => {\n      const open = s.pitchVenue === v.id;\n      return {\n        name: v.name, area: v.area, kind: v.kind, about: v.about,\n        hosts: v.hosts.map((t) => ({ t })),\n        open, closed: !open, cls: open ? 'open' : '',\n        openForm: () => set({ pitchVenue: v.id, pitchError: '' }),\n        cancel: () => set({ pitchVenue: '', pitchError: '' }),\n        pitchCls: ask ? '' : 'on', pitchPressed: ask ? 'false' : 'true',\n        askCls: ask ? 'on' : '', askPressed: ask ? 'true' : 'false',\n        modePitch: () => set({ pitchMode: 'pitch' }), modeAsk: () => set({ pitchMode: 'ask' }),\n        titleLabel: ask ? 'What is your question about?' : 'Event title',\n        idTitle: 'p-title-' + v.id, idDate: 'p-date-' + v.id, idMsg: 'p-msg-' + v.id,\n        fTitle: s.pitchTitle, fDate: s.pitchDate, fMsg: s.pitchMsg,\n        onTitle, onDate, onMsg,\n        hasError: open && s.pitchError !== '', error: s.pitchError,\n        send: () => {\n          if (!s.pitchTitle.trim() || !s.pitchMsg.trim()) {\n            set({ pitchError: 'Add a title and a short message so the venue knows what you have in mind.' });\n            return;\n          }\n          set({\n            pitches: [{ venue: v.name, title: s.pitchTitle.trim(), modeLabel: ask ? 'Question sent' : 'Pitch sent' }].concat(s.pitches),\n            pitchVenue: '', pitchTitle: '', pitchDate: '', pitchMsg: '', pitchError: '', pitchMode: 'pitch'\n          });\n          top();\n        }\n      };\n    });\n    const labels = ['Sent', 'Venue replies', 'Planning together', 'Event goes live'];\n    const pitches = s.pitches.map((p) => ({\n      title: p.title, venue: p.venue, modeLabel: p.modeLabel,\n      steps: labels.map((label, i) => ({ label, cls: i === 0 ? 'done' : (i === 1 ? 'cur' : '') }))\n    }));\n\n    const allEvents = this.getEvents();\n    const toDetail = (id) => () => { set({ selId: id, screen: 'detail' }); top(); };\n    const regItems = s.reserved.map((id) => allEvents.filter((e) => e.id === id)[0]).filter(Boolean).map((e, n) => ({\n      title: e.title, sub: e.venue + ', ' + e.area + ' · ' + e.dow + ' ' + e.t
